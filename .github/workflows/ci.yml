name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Tokens are up to date
        run: pnpm tokens:check
      - name: Copy lint (AI jargon, placeholders)
        run: pnpm lint:copy
      - name: Parts exist in both forms (React + rc-* CSS)
        run: pnpm lint:parts
      - name: Design lint (recanica check, incl. decision-log pattern guards)
        run: pnpm lint:design
      - name: Decision log (recanica decisions lint, fails on must-fix)
        run: pnpm lint:decisions
      - name: AI-slop check (recanica slop apps/docs templates, fails on must-fix)
        run: pnpm lint:slop
      - run: pnpm build
      - run: pnpm typecheck
      - name: Install Playwright (the CLI tests launch a browser too)
        run: pnpm --filter docs exec playwright install --with-deps chromium
      - name: Package tests (CLI fixtures, MCP smoke)
        run: pnpm --filter recanica --filter @recanica/mcp test
      - name: Layout, coverage, link and UX audits (every page, mobile + desktop)
        run: pnpm test:audit
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/docs/playwright-report, retention-days: 7 }
