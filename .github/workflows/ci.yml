name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Tokens are up to date
        run: pnpm tokens:check
      - name: Copy lint (AI jargon, placeholders)
        run: pnpm lint:copy
      - run: pnpm build
      - run: pnpm typecheck
      - name: Package tests (CLI fixtures, MCP smoke)
        run: pnpm --filter rekanica --filter @rekanica/mcp test
      - name: Install Playwright
        run: pnpm --filter docs exec playwright install --with-deps chromium
      - name: Layout audit (every page, mobile + desktop)
        run: pnpm test:layout
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/docs/playwright-report, retention-days: 7 }
